# ============================================================
# Perfil LOCAL — H2 simulando Oracle (pruebas sin Oracle Cloud)
# ------------------------------------------------------------
# Se conecta a la MISMA base H2 en archivo que ms-usuarios (~/foro-h2),
# igual que ambos comparten el esquema en Oracle.
#
# ms-foro NO crea tablas: las crea ms-usuarios al iniciar.
# → Levantar ms-usuarios ANTES que ms-foro.
#
# (schema-h2.sql y data-h2.sql se mantienen aquí solo para los tests
#  automáticos, que usan su propia base en memoria.)
# ============================================================
spring.datasource.url=jdbc:h2:file:~/foro-h2/foro;MODE=Oracle;AUTO_SERVER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema-h2.sql
spring.sql.init.data-locations=classpath:data-h2.sql
spring.sql.init.encoding=UTF-8

spring.h2.console.enabled=false
