# ============================================================
# Perfil ORACLE — Oracle Autonomous Database (Oracle Cloud)
# ------------------------------------------------------------
# 1. Descarga el Wallet desde la consola de Oracle Cloud y descomprímelo
#    en la carpeta raíz del proyecto (Wallet_foro/, junto a docker-compose.yml).
# 2. Revisa en tnsnames.ora el nombre del servicio (ej: foro_high).
# 3. Define DB_PASSWORD (obligatoria) y, si cambian, DB_SERVICIO / DB_USUARIO / DB_WALLET.
# ============================================================
spring.datasource.url=jdbc:oracle:thin:@${DB_SERVICIO:foro_high}?TNS_ADMIN=${DB_WALLET:../Wallet_foro}
spring.datasource.username=${DB_USUARIO:ADMIN}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# El esquema ya fue creado con el script, no se ejecuta nada al iniciar
spring.sql.init.mode=never

# Pool de conexiones pequeño: la base gratuita de Oracle (Always Free) admite pocas sesiones a la vez
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
