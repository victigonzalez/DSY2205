# ============================================================
# Perfil ORACLE — Oracle Autonomous Database (Oracle Cloud)
# ------------------------------------------------------------
# 1. Descarga el Wallet desde la consola de Oracle Cloud y descomprímelo
#    en la carpeta raíz del proyecto (ej: foro-backend/Wallet_foro).
# 2. Revisa en tnsnames.ora el nombre del servicio (ej: foro_high).
# 3. Ajusta las variables de entorno o los valores por defecto de abajo.
# ============================================================
spring.datasource.url=jdbc:oracle:thin:@${DB_SERVICIO:foro_high}?TNS_ADMIN=${DB_WALLET:../Wallet_foro}
spring.datasource.username=${DB_USUARIO:ADMIN}
spring.datasource.password=${DB_PASSWORD:CambiarPassword123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# El esquema ya fue creado con el script, no se ejecuta nada al iniciar
spring.sql.init.mode=never
