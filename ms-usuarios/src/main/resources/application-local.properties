# ============================================================
# Perfil LOCAL — H2 simulando Oracle (pruebas sin Oracle Cloud)
# ------------------------------------------------------------
# Base H2 en archivo (~/foro-h2) COMPARTIDA con ms-foro, igual que
# ambos comparten el esquema en Oracle. AUTO_SERVER permite que los
# dos microservicios se conecten a la vez.
#
# ms-usuarios es quien CREA las tablas y carga los datos de ejemplo
# (schema-h2.sql y data-h2.sql = mismas tablas/datos que bd/script_foro.sql).
# → Levantar ms-usuarios ANTES que ms-foro.
# → Cada vez que ms-usuarios se reinicia, los datos vuelven a su estado inicial.
#
# Consola H2: http://localhost:8081/h2-console
#   JDBC URL: jdbc:h2:file:~/foro-h2/foro;MODE=Oracle;AUTO_SERVER=TRUE   usuario: sa   (sin contraseña)
# ============================================================
spring.datasource.url=jdbc:h2:file:~/foro-h2/foro;MODE=Oracle;AUTO_SERVER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql
spring.sql.init.data-locations=classpath:data-h2.sql
spring.sql.init.encoding=UTF-8

spring.h2.console.enabled=true
