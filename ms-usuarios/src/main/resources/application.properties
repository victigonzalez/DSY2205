# ============================================================
# ms-usuarios — configuración común
# ------------------------------------------------------------
# Perfiles disponibles:
#   oracle → Oracle Autonomous Database en Oracle Cloud (Wallet)  [por defecto]
#   local  → H2 en memoria en modo Oracle (pruebas sin internet)
# Cambiar perfil:  mvn spring-boot:run -Dspring-boot.run.profiles=local
# ============================================================
spring.application.name=ms-usuarios
server.port=8081

spring.profiles.active=${PERFIL:oracle}

# JPA: las tablas las crea el script bd/script_foro.sql, Hibernate no las modifica
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Respuestas JSON legibles y fechas en formato ISO
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false

# Actuator: solo exponer el estado de salud
management.endpoints.web.exposure.include=health,info

# Logging: INFO general y DEBUG para nuestro paquete
logging.level.root=INFO
logging.level.cl.duoc.foro=DEBUG
# Evita que DevTools duplique en el log los errores ya registrados por GlobalExceptionHandler
spring.mvc.log-resolved-exception=false

# CORS: frontends que pueden consumir la API (separados por coma)
app.cors.origenes=http://localhost:4200,http://localhost:3000
