# ============================================================
# Ágora — despliegue en la nube (Play with Docker)
# ------------------------------------------------------------
# NO compila nada: descarga las imágenes ya publicadas en Docker Hub
# (Container Registry) y las ejecuta. Ver DESPLIEGUE.md.
#
# En la instancia de Play with Docker deben estar:
#   · este archivo
#   · Wallet_foro/   (Wallet de Oracle descomprimido)
#   · .env           (DB_PASSWORD=... y DOCKERHUB_USUARIO=...)
#
#   docker compose -f docker-compose.pwd.yml up -d
# ============================================================
name: agora

x-backend: &backend
  environment:
    PERFIL: oracle
    DB_SERVICIO: ${DB_SERVICIO:-foro_high}
    DB_USUARIO: ${DB_USUARIO:-ADMIN}
    DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
    DB_WALLET: /wallet
    CORS_ORIGENES: ${CORS_ORIGENES:-*}
    JAVA_TOOL_OPTIONS: -Xms128m -Xmx320m
  volumes:
    - ./Wallet_foro:/wallet:ro
  networks: [agora-red]
  restart: unless-stopped

services:
  ms-usuarios:
    <<: *backend
    image: ${DOCKERHUB_USUARIO:?Define DOCKERHUB_USUARIO en el archivo .env}/agora-ms-usuarios:1.0
    ports: ["8081:8081"]

  ms-foro:
    <<: *backend
    image: ${DOCKERHUB_USUARIO}/agora-ms-foro:1.0
    ports: ["8082:8082"]
    depends_on: [ms-usuarios]

  ms-moderacion:
    <<: *backend
    image: ${DOCKERHUB_USUARIO}/agora-ms-moderacion:1.0
    ports: ["8083:8083"]
    depends_on: [ms-usuarios]

  frontend:
    image: ${DOCKERHUB_USUARIO}/agora-frontend:1.0
    ports: ["8080:80"]
    networks: [agora-red]
    restart: unless-stopped

networks:
  agora-red:
    name: agora-red
