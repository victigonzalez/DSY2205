# ============================================================
# Configuración común (generada con foro-microservicio-archetype)
# ------------------------------------------------------------
# Perfiles:
#   oracle → Oracle Autonomous Database en Oracle Cloud (Wallet)  [por defecto]
#   local  → H2 en modo Oracle (pruebas sin internet)
# Cambiar: mvn spring-boot:run -Dspring-boot.run.profiles=local   o   PERFIL=local
# Nombre y puerto se inyectan desde el pom.xml al compilar (@...@).
# ============================================================
spring.application.name=@project.artifactId@
server.port=${SERVER_PORT:@app.puerto@}

spring.profiles.active=${PERFIL:oracle}

# JPA: el esquema lo crea bd/script_foro.sql; Hibernate no lo modifica
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JSON legible y fechas ISO
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false

# Actuator: solo el estado de salud
management.endpoints.web.exposure.include=health,info

# Logging
logging.level.root=INFO
logging.level.cl.duoc.foro=DEBUG
spring.mvc.log-resolved-exception=false

# CORS: frontends que pueden consumir la API (separados por coma)
app.cors.origenes=${CORS_ORIGENES:http://localhost:4200,http://localhost:8080}
