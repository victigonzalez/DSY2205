# ============================================================
# Perfil ORACLE — Oracle Autonomous Database (Oracle Cloud)
# ------------------------------------------------------------
# DB_WALLET: carpeta del Wallet descomprimido
#   · ejecución local:  ../Wallet_foro   (relativa a la carpeta del microservicio)
#   · en Docker:        /wallet          (montada como volumen, nunca dentro de la imagen)
# ============================================================
spring.datasource.url=jdbc:oracle:thin:@${DB_SERVICIO:foro_high}?TNS_ADMIN=${DB_WALLET:../Wallet_foro}
spring.datasource.username=${DB_USUARIO:ADMIN}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.sql.init.mode=never

# Pool de conexiones pequeño: la base gratuita de Oracle (Always Free) admite pocas sesiones a la vez
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
