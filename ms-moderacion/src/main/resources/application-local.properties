# ============================================================
# Perfil LOCAL — H2 simulando Oracle (pruebas sin Oracle Cloud)
# ------------------------------------------------------------
# Base H2 en archivo COMPARTIDA por los microservicios del foro (~/foro-h2),
# igual que comparten el esquema en Oracle. ms-usuarios la crea al iniciar;
# los demás se conectan a ella (levantar ms-usuarios primero).
# H2_URL permite apuntarla a otra ubicación (ej: un volumen Docker).
# ============================================================
spring.datasource.url=${H2_URL:jdbc:h2:file:~/foro-h2/foro;MODE=Oracle;AUTO_SERVER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.sql.init.mode=never
spring.h2.console.enabled=false
